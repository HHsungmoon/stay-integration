spring:
  application:
    name: stayintegration
  docker:
    compose:
      # compose.yaml은 저장소 루트에 있고 bootRun의 작업 디렉토리는 app/ 이므로
      # 한 단계 위를 가리킨다. (developmentOnly 의존성이라 jar 실행에는 영향 없음)
      file: ../compose.yaml
  jpa:
    hibernate:
      # Flyway를 쓰지 않는다 — 테이블 2개 규모에서 마이그레이션 이력이 산출물이 아니다. 근거는 README.
      # 주의: update는 기존 테이블의 제약을 바꾸지 않는다. 로컬(compose, 볼륨 없음)과 테스트(Testcontainers)는
      # 매번 새 DB라 문제없지만, 실운영이라면 Flyway + validate가 맞다.
      ddl-auto: update
    # 트랜잭션 경계는 service에만 둔다. 세션을 컨트롤러까지 끌고 가면 경계가 흐려진다.
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Boot 4 기본은 health뿐. metrics를 연다. env·beans는 열지 않는다 — env에 공급사 API 키가 보인다.
        # 관리 엔드포인트 인증은 범위 밖(README). Prometheus 레지스트리는 스크레이퍼가 생길 때 설정 두 줄로 붙인다(08 §6)
        include: health,metrics

catalog:
  # 기동 시 1회 동기화(D-8). 실패해도 앱은 뜨고 기존 매핑으로 서비스한다.
  sync-on-startup: true
  # 공급사별 응답 타임아웃(2s)보다 길고, 검색 데드라인(D-7 3s)과 같은 값
  sync-deadline: 3s

supplier:
  endpoints:
    # 키가 곧 SupplierId다. 어댑터는 기동 시 자기 항목을 찾고 없으면 기동에 실패한다(fail-fast).
    # Docker Compose에서는 SUPPLIER_ENDPOINTS_A_BASE_URL=http://mock-supplier:9090 으로 덮는다 — 컨테이너 안에서 localhost는 자기 자신이다.
    a:
      base-url: http://localhost:9090
      api-key: mock-key-a
      # 같은 네트워크 대역의 정상 연결은 수십 ms. 이 이상 기다리는 것은 회복이 아니라 대기다(D-7)
      connect-timeout: 500ms
      # 검색 전체 목표 3s에서 병합·직렬화 여유를 뺀 값(D-7)
      response-timeout: 2s
    b:
      base-url: http://localhost:9090
      api-key: mock-key-b
      connect-timeout: 500ms
      response-timeout: 2s
  # 서킷 브레이커 — 공급사 공통, 인스턴스는 공급사별. 이미 아는 실패에 매 검색마다 2초를 태우지 않기 위한 장치(07)
  circuit:
    # 호출 수 기준 창. 검색 1건 = 공급사당 청크 1호출이므로 최소 10은 "여러 번의 검색"이지 한 번의 사고가 아니다
    sliding-window-size: 20
    minimum-number-of-calls: 10
    # 절반이 실패하는 공급사는 이미 검색 품질을 망친다. 더 높이면 열릴 때쯤엔 사용자가 다 겪은 뒤다
    failure-rate-threshold: 50
    # 검색 데드라인 3s의 3배 이상. 짧으면 죽은 공급사를 계속 두드리고, 길면 복구를 늦게 알아챈다
    wait-duration-in-open-state: 10s
    # 1이면 우연한 실패 한 번에 다시 10초 닫힌다. 3이면 3호출의 실패율로 판정한다(1건 실패는 닫힘, 2건이면 다시 열림)
    permitted-number-of-calls-in-half-open-state: 3

search:
  # 공급사 계약 상한. 어댑터가 51개를 거절하므로 이 값이 틀리면 테스트가 바로 잡는다
  chunk-size: 50
  # 한 공급사에 동시에 여는 연결 수. 응답 2s × 4 = 한 파동에 숙소 200개. 근거 있는 값이 아니라 출발점(06 §4·§13)
  concurrency-per-supplier: 4
  # D-7 오케스트레이션 데드라인. 공급사 단위로 걸리며, 초과 시 도착한 청크는 살리고 안 온 청크만 TIMEOUT(D-9)
  deadline: 3s
