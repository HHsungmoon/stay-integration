spring:
  application:
    name: stayintegration
  docker:
    compose:
      # compose.yaml은 저장소 루트에 있고 bootRun의 작업 디렉토리는 app/ 이므로
      # 한 단계 위를 가리킨다. (developmentOnly 의존성이라 jar 실행에는 영향 없음)
      file: ../compose.yaml
  jpa:
    hibernate:
      # Flyway를 쓰지 않는다 — 테이블 2개 규모에서 마이그레이션 이력이 산출물이 아니다. 근거는 README.
      # 주의: update는 기존 테이블의 제약을 바꾸지 않는다. 로컬(compose, 볼륨 없음)과 테스트(Testcontainers)는
      # 매번 새 DB라 문제없지만, 실운영이라면 Flyway + validate가 맞다.
      ddl-auto: update
    # 트랜잭션 경계는 service에만 둔다. 세션을 컨트롤러까지 끌고 가면 경계가 흐려진다.
    open-in-view: false

server:
  port: 8080

catalog:
  # 기동 시 1회 동기화(D-8). 실패해도 앱은 뜨고 기존 매핑으로 서비스한다.
  sync-on-startup: true
  # 공급사별 응답 타임아웃(2s)보다 길고, 검색 데드라인(D-7 3s)과 같은 값
  sync-deadline: 3s

supplier:
  endpoints:
    # 키가 곧 SupplierId다. 어댑터는 기동 시 자기 항목을 찾고 없으면 기동에 실패한다(fail-fast).
    # Docker Compose에서는 SUPPLIER_ENDPOINTS_A_BASE_URL=http://mock-supplier:9090 으로 덮는다 — 컨테이너 안에서 localhost는 자기 자신이다.
    a:
      base-url: http://localhost:9090
      api-key: mock-key-a
      # 같은 네트워크 대역의 정상 연결은 수십 ms. 이 이상 기다리는 것은 회복이 아니라 대기다(D-7)
      connect-timeout: 500ms
      # 검색 전체 목표 3s에서 병합·직렬화 여유를 뺀 값(D-7)
      response-timeout: 2s
    b:
      base-url: http://localhost:9090
      api-key: mock-key-b
      connect-timeout: 500ms
      response-timeout: 2s
